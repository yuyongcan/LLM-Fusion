# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.config.DistillationConfig

# specify the default per-component configs
defaults:

  # <folder_name>@<field_name>.<field_name>: <yaml_file_name>

  # load the default config, then apply the fields in the current yaml
  # self config override anything above
  - _self_

# Whether to enable distillation.
enabled: false

# Where the teacher runs.
#
#   vllm        (default) Teacher is served from the dedicated teacher resource pool below, and
#               its log probs are computed per sample during rollout via prompt_logprobs.
#   in_process  Teacher is a frozen HF model fused into ActorRolloutRefWorker, exactly like the
#               reference policy: no teacher pool (set nnodes/n_gpus_per_node to 0 and give those
#               GPUs to trainer.nnodes), one batched forward per step between ref_log_prob and
#               update_actor, while vLLM is asleep. Supports exactly one teacher and requires an
#               estimator loss_mode (k1, k3, ...). Unlike the vLLM path it has no
#               temperature == 1.0 restriction, since an HF forward can scale logits freely.
#
# "vllm" reproduces the behaviour from before this knob existed bit-for-bit.
mode: vllm

# distillation loss config
distillation_loss:

  # # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.DistillationLossConfig


  # Loss function mode for distillation.
  #
  #   forward_kl_topk  Forward KL over the teacher's top-`topk` tokens, computed in the logits
  #                    processor so the [T, vocab] loss is never materialised. Mode-covering,
  #                    and deterministic given the rollout -- it never reads the student's
  #                    sampled token, so it carries no sampling variance.
  #                      L_t = sum_k p_T(v_k) * (log p_T(v_k) - log pi_S(v_k))
  #
  #   argmax_ce        Cross-entropy against the teacher's single argmax token. Requires
  #                    topk: 1 and use_policy_gradient=False (config-time checks). Strictly the
  #                    topk=1 limit of the above with two things taken out, and both are what
  #                    the mode is for:
  #                      L_t = -log pi_S(argmax_v p_T(v))
  #                    * no p_T(argmax) weighting: a teacher that is unsure of its own top
  #                      choice still contributes at full strength, including positions where
  #                      the argmax is decided by bf16 rounding in the teacher's forward pass;
  #                    * no zero clamp: topk=1 stops supervising a position once the student is
  #                      more confident on the argmax than the teacher is; here the gradient
  #                      keeps pushing pi_S(argmax) -> 1.
  #                    Its fixed point is the teacher's greedy decoding, not the teacher's
  #                    distribution, so it cannot converge to pi_teacher. Fine under greedy
  #                    evaluation, a liability under sampled evaluation.
  #
  #   k1 / k3 / ...    Single-sample KL estimators at the student's sampled token. Reverse KL
  #                    (mode-seeking), and high variance since they read only one sampled token.
  loss_mode: k3

  # If distillation loss requires top-k logits, this is the value of k.
  # Must be 1 for loss_mode="argmax_ce".
  topk: 32

  # Whether to include task rewards alongside distillation loss.
  use_task_rewards: true

  # How the teacher signal enters the RL update (KDRL, https://arxiv.org/abs/2506.02208).
  #
  #   none      (default) the teacher keeps its own policy loss, added to the RL one. Each is
  #             a PPO surrogate clipped on its own advantage. Bit-for-bit the behaviour from
  #             before this knob existed.
  #   additive  the teacher becomes a dense token-level term *inside* the RL advantage, and the
  #             two run under a single PPO clip:
  #
  #               A_t = A_hat + teacher_advantage_coef * (log pi_teacher - log pi_student)
  #
  #             These are not two ways of writing the same objective: clipping the sum is not
  #             the sum of the clips. With one fused advantage the clip decides once, on the
  #             combined direction, which is what lets the teacher term flip the sign of an
  #             update the verifier wanted -- the exact property that motivated the
  #             teacher-modulated variants.
  #
  #   per_domain  per-sample routing: samples whose data_source is listed in opd_data_sources
  #               are supervised by OPD alone, every other sample by the verifier reward alone:
  #
  #                 A_t = teacher_advantage_coef * (log pi_teacher - log pi_student)   [OPD]
  #                 A_t = A_hat                                                        [RLVR]
  #
  #               The two never mix. This is deliberately NOT "KDRL with a per-sample beta":
  #               raising teacher_advantage_coef does not dilute the RLVR domains, and no
  #               setting of it reproduces "additive". It exists to distil one domain from a
  #               teacher that is strong there while the rest of the mixture keeps its own
  #               verifiable reward. Requires opd_data_sources to be non-empty.
  #
  # "additive" and "per_domain" both require use_task_rewards=true and an estimator loss_mode
  # (k1, k3, ...), and both report the teacher term under distillation/teacher_advantage_*
  # rather than distillation/loss.
  advantage_fusion: none

  # data_source values supervised by OPD instead of the verifier reward. Only read when
  # advantage_fusion="per_domain", and required there (an empty list is rejected: it would
  # leave every sample on the RL advantage and the teacher would silently do nothing).
  # Matched exactly against the batch's data_source column, e.g. "LLM-Fusion/IF".
  #
  # ⚠️ Under "per_domain", configure exactly ONE teacher. The teacher advantage is computed for
  #    every sample and only then discarded on the non-OPD ones, so a multi-teacher setup would
  #    also need a teacher for each non-OPD domain -- otherwise the router raises "No teacher
  #    configured for routing key ...". With a single teacher the router ignores the sample's key
  #    and serves every sample, which is what this mode needs. The cost is that teacher log probs
  #    are computed for samples that never consume them.
  opd_data_sources: []

  # beta of KDRL: weight of the teacher advantage. Ignored unless advantage_fusion="additive".
  # Under "per_domain" it instead scales the OPD term on the routed domains only -- 1.0 is
  # plain OPD, and raising it strengthens distillation without touching the RLVR domains.
  # ⚠️ Extremely task-sensitive -- reported values span two orders of magnitude (0.2 on some
  #    logic tasks, 0.02 on others, 0.002 on math). Treat any value carried over from another
  #    task as a starting point for an ablation, not as a setting.
  teacher_advantage_coef: 0.0


  # The coef of the distillation loss when use_task_rewards is true
  distillation_loss_coef: 1.0

  # Optional max clamp value for distillation loss. If null, no clamping is applied.
  loss_max_clamp: null

  # Optional min clamp value for log probabilities for stability, e.g., log q - log p where p or q are very close to zero.
  log_prob_min_clamp: null

  # Whether to incorporate distillation loss as a reward.
  use_policy_gradient: false

  # Name of the policy loss to use when use_policy_gradient is true.
  policy_loss_mode: "vanilla"

  # PPO clipping ratio for policy loss.
  clip_ratio: 0.2

  # Lower bound for PPO clipping ratio.
  clip_ratio_low: 0.2 

  # Upper bound for PPO clipping ratio.
  clip_ratio_high: 0.2

  # Reward scaling factor lambda of Generalized On-Policy Distillation
  # (ExOPD, https://arxiv.org/abs/2602.12125).
  #
  # Standard OPD is a dense KL-constrained RL whose implicit reward log(teacher/reference)
  # and KL regularization are forced to weigh the same. This is that weight ratio:
  #
  #   advantage = (log pi_teacher - log pi_student)
  #             + (lambda - 1) * (log pi_teacher - log pi_reference)
  #
  #   1.0   standard OPD -- bit-for-bit the behaviour before this knob existed, and the
  #         only value that needs no reference policy.
  #   >1.0  reward extrapolation (ExOPD): step past the teacher along teacher-minus-reference.
  #         The paper uses 1.25 throughout and reports 1.5 as unstable, the student starting
  #         to hack the implicit reward by chasing tokens with a large log ratio.
  #   <1.0  reward interpolation: deliberately lands between reference and teacher.
  #
  # Non-1.0 values require an estimator loss_mode (k1, k3, ...) and use_policy_gradient=true,
  # and they switch on the reference policy worker -- one extra frozen model plus one extra
  # forward pass per step. The reference is the frozen initial student, which is what this
  # formula wants whenever the student starts from the same base the teachers were built on.
  reward_extrapolation_lambda: 1.0

  # ---- Representation distillation (OPRD, https://arxiv.org/abs/2606.06021) ----
  #
  # Output-space distillation reaches the student only through the LM head, a low-rank and
  # softmax-shift-invariant projection: hidden-state differences in its effective null space
  # produce no loss at all. Aligning hidden states directly removes that bottleneck, and the MSE
  # is deterministic given the rollout, so it carries none of the sampling variance that stalls
  # sampled-token OPD near convergence. Composes additively:
  #
  #   L = L_opd + rep_coef * L_rep
  #
  # Weight of the representation term. 0.0 (default) disables it and is bit-for-bit the
  # behaviour from before this knob existed. Requires distillation.mode="in_process", since
  # only the in-process HF teacher can return hidden states.
  # ⚠️ The usable scale depends on rep_normalize below -- a normalized MSE is far smaller than
  #    an unnormalized one, so a coefficient tuned for one is wrong for the other.
  rep_coef: 0.0

  # Which layers to align, indexed into HF hidden_states: 0 is the embedding output, k is the
  # output of block k. Layer 0 is rejected (it distils the embedding table, not teacher
  # computation). The default samples four points up a 36-layer stack rather than all of them:
  # cost is linear in this list, and all 36 layers over a 2000-token suffix is ~350 MB/sample
  # against ~39 MB for four.
  rep_layers: [9, 18, 27, 36]

  # Align only the final k response tokens. OPRD figure 8 measures where the models actually
  # disagree: the first k tokens stay above 97% cosine similarity for every k, while the last k
  # start at 91.65% and remain 4+ points lower, so the prefix carries little residual signal.
  rep_last_k: 2000

  # L2-normalize both hidden states before the MSE, making the loss scale-invariant and purely
  # directional. true matches the reference implementation's shipped behaviour. false compares
  # raw vectors, keeping magnitude information (hidden-state norms vary several-fold across
  # positions) but tying the loss scale to the model's activation scale, which needs a much
  # smaller rep_coef -- the OPRD authors note their own paper numbers used the unnormalized form
  # with a coefficient 100-1000x larger.
  rep_normalize: true


# Number of GPUs per node in the distillation teacher resource pool
n_gpus_per_node: 8

# Number of nodes in the distillation teacher resource pool
nnodes: 0

# multi-teacher configs
teacher_models:

  # Single-teacher config. This entry is popped when other teacher entries are added, so
  # using `teacher_model` as one of several keys silently drops it. For
  # example, the following CLI overrides result in ONLY `teacher_model2` being used:
  #
  # distillation.teacher_models.teacher_model.key=openai/gsm8k
  # distillation.teacher_models.teacher_model.model_path=Qwen/Qwen3-4B
  # +distillation.teacher_models.teacher_model2.key=hiyouga/geometry3k
  # +distillation.teacher_models.teacher_model2.model_path=Qwen/Qwen3-VL-4B-Instruct
  #
  # Instead, give the first teacher a different name:
  #
  # +distillation.teacher_models.teacher_model1.key=openai/gsm8k
  # +distillation.teacher_models.teacher_model1.model_path=Qwen/Qwen3-4B
  # +distillation.teacher_models.teacher_model2.key=hiyouga/geometry3k
  # +distillation.teacher_models.teacher_model2.model_path=Qwen/Qwen3-VL-4B-Instruct
  teacher_model:
    _target_: verl.workers.config.DistillationTeacherModelConfig
    key: null
    model_path: null
    num_replicas: 0
    inference:
      _target_: verl.workers.config.RolloutConfig
      name: ${oc.select:actor_rollout_ref.rollout.name}
      dtype: ${oc.select:actor_rollout_ref.rollout.dtype}
      gpu_memory_utilization: 0.5
      enforce_eager: true
      cudagraph_capture_sizes: null
      free_cache_engine: true
      data_parallel_size: 1
      expert_parallel_size: 1
      tensor_model_parallel_size: 2
      max_num_batched_tokens: 8192
      max_model_len: null
      max_num_seqs: 1024
      load_format: auto
      engine_kwargs: {}
      limit_images: null
      enable_chunked_prefill: true
      enable_prefix_caching: true
      disable_log_stats: true
      skip_tokenizer_init: true
      prompt_length: ${oc.select:actor_rollout_ref.rollout.prompt_length}
      response_length: ${oc.select:actor_rollout_ref.rollout.response_length}
      temperature: ${oc.select:actor_rollout_ref.rollout.temperature}

# Key to route examples to the appropriate teacher model in multi-teacher setups. Should correspond to a field in the data proto, e.g., task.
teacher_key: data_source